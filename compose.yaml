services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: csv_pipeline
      POSTGRES_USER: csv_pipeline
      POSTGRES_PASSWORD: csv_pipeline
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csv_pipeline"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports: ["9092:9092"]
  upload-api:
    build:
      context: .
      args: { APP: upload-api }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/csv_pipeline
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }
  worker:
    build:
      context: .
      args: { APP: processing-worker }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/csv_pipeline
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      THIRD_PARTY_URL: http://third-party-stub:8082
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      S3_BUCKET: ${S3_BUCKET}
    depends_on: [upload-api, third-party-stub]
  third-party-stub:
    build:
      context: .
      args: { APP: third-party-stub }
    ports: ["8082:8082"]
